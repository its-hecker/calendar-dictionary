name: Build Android APK

on:
  push:
    branches: [calendar, dictionary]
  workflow_dispatch:
    inputs:
      app:
        description: App branch to build
        required: true
        type: choice
        default: calendar
        options: [calendar, dictionary]

permissions:
  contents: write

concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && inputs.app || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.app || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.app || github.sha }}
          persist-credentials: false

      - name: Select app
        shell: bash
        run: |
          case "$APP_BRANCH" in
            calendar)
              echo "APP_NAME=Calendar" >> "$GITHUB_ENV"
              echo "APK_NAME=Calendar.apk" >> "$GITHUB_ENV"
              ;;
            dictionary)
              echo "APP_NAME=Urdu Dictionary" >> "$GITHUB_ENV"
              echo "APK_NAME=Urdu-Dictionary.apk" >> "$GITHUB_ENV"
              ;;
            *) echo "Unsupported app branch: $APP_BRANCH" >&2; exit 1 ;;
          esac
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify offline dictionary assets
        if: env.APP_BRANCH == 'dictionary'
        run: python3 tools/verify_lexicon.py

      - name: Verify online data parsing
        if: env.APP_BRANCH == 'dictionary'
        run: node --test tests/online-data.test.cjs

      - name: Check page JavaScript
        run: |
          node --check app/src/main/assets/app.js
          if [ "$APP_BRANCH" = "dictionary" ]; then node --check app/src/main/assets/example-credits.js; node --check app/src/main/assets/online-data.js; fi

      - name: Build APK and run Android lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --stacktrace --console=plain

      - name: Enable emulator acceleration
        if: env.APP_BRANCH == 'dictionary'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test online lookup in Android WebView
        if: env.APP_BRANCH == 'dictionary'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload Android test results
        if: always() && env.APP_BRANCH == 'dictionary'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dictionary-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify packaged dictionary APK
        if: env.APP_BRANCH == 'dictionary'
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare download
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          cat > dist/release-notes.md <<EOF
          Standalone Android app built from the $APP_BRANCH branch.

          Source commit: $SOURCE_SHA

          Android 10 or newer. Install $APK_NAME; the other app is installed separately.
          Updated interface, developer info and Telegram channel.
          Dictionary 2.3 fixes capitalized online searches, adds a backup dictionary service and restores retry controls on timeouts.
          This is a debug-signed test APK. The bundled library works offline; online lookup requires internet.
          Dictionary speech depends on installed Android voices and a speech recognition provider.
          EOF

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.APP_BRANCH }}-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.APP_BRANCH }}-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$APP_BRANCH-build-${{ github.run_number }}-${{ github.run_attempt }}" \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$SOURCE_SHA" \
            --title "$APP_NAME build ${{ github.run_number }}" \
            --notes-file dist/release-notes.md \
            --prerelease --latest=false

          # Remove only the first 2.1 test release, whose .gz asset was renamed by aapt.
          # Keep its commit/tag history; a corrected APK has now passed packaging checks.
          if [ "$APP_BRANCH" = "dictionary" ]; then
            previous=$(gh api "repos/$GH_REPO/releases/tags/dictionary-build-8-1" --jq .target_commitish 2>/dev/null || true)
            if [ "$previous" = "430e9e91999668a9c821fc3312953995d842dc3d" ]; then
              gh release delete dictionary-build-8-1 --yes
            fi
          fi
